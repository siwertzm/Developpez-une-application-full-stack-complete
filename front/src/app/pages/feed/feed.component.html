<div class="feed-page">
  <app-header mode="private"></app-header>

  <!-- CONTENU -->
  <div class="feed-content">
    <div class="feed-toolbar">
      <button class="create-btn" routerLink="/post/create">
        Créer un article
      </button>

      <button class="sort-btn" type="button" (click)="toggleSort()">
        Trier par
        <span>{{ sort === "desc" ? "↓" : "↑" }}</span>
      </button>
    </div>

    <p class="status-message" *ngIf="loading">Chargement...</p>
    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="posts-grid" *ngIf="!loading && !errorMessage">
      <article
        class="post-card"
        *ngFor="let post of posts; trackBy: trackByPostId"
        [routerLink]="['/posts', post.id]"
      >
        <div class="post-header">
          <h2>{{ post.title }}</h2>
          <span class="topic">{{ post.topicName }}</span>
        </div>

        <div class="post-meta">
          <span>{{ post.createdAt | date: "dd/MM/yyyy" }}</span>
          <span>{{ post.authorUsername }}</span>
        </div>

        <p class="post-content">
          {{ post.content }}
        </p>
      </article>
    </div>
  </div>
</div>
