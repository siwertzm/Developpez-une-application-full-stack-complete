<app-header class="desktop-header" mode="public"></app-header>

<div class="login-page">
  <div class="login-card">
    <button class="back-btn" type="button" (click)="goBack()" aria-label="Retour">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <img src="/assets/logo_p6.png" alt="Logo MDD" class="mobile-logo" />

    <h1>Se connecter</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput type="text" formControlName="login" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="submit-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Chargement...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
